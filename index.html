<script>
/* ---- hero video: autoplays muted, button toggles sound ---- */
(function () {
  var v = document.getElementById('mainVideo');
  var b = document.getElementById('soundBtn');
  var fb = document.getElementById('playFallback');
  if (!v) return;

  function tryPlay() {
    v.muted = true;                     // muted autoplay is what browsers allow
    var p = v.play();
    if (p && p.then) {
      p.then(function () { if (fb) fb.hidden = true; })
       .catch(function () { if (fb) fb.hidden = false; });
    }
  }
  tryPlay();
  v.addEventListener('canplay', function () { if (v.paused) tryPlay(); });
  v.addEventListener('play',  function () { if (fb) fb.hidden = true; });
  v.addEventListener('pause', function () { if (fb && !v.ended) fb.hidden = false; });

  // some browsers only allow playback after the first interaction
  ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (ev) {
    window.addEventListener(ev, function once() {
      if (v.paused) tryPlay();
      ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (e2) {
        window.removeEventListener(e2, once);
      });
    }, { passive: true });
  });
  if (fb) fb.addEventListener('click', tryPlay);

  if (!b) return;
  b.addEventListener('click', function () {
    v.muted = !v.muted;
    if (!v.muted) v.play();
    b.setAttribute('aria-pressed', String(!v.muted));
    b.setAttribute('aria-label', v.muted ? 'הפעלת קול' : 'השתקה');
    b.classList.toggle('is-on', !v.muted);
  });
})();

/* ---- keep the page from shifting when the scrollbar is hidden ----
   `scrollbar-gutter: stable` (style.css) already reserves the scrollbar's
   space, so padding is only added where that isn't supported. Doing both
   compensates twice and shifts the page by the scrollbar width. */
(function () {
  var lock = 0;
  var gutterOK = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');
  var side = getComputedStyle(document.documentElement).direction === 'rtl'
    ? 'paddingLeft' : 'paddingRight';   // the root scrollbar sits on the left in RTL
  window.__scrollLock = function (on) {
    lock = Math.max(0, lock + (on ? 1 : -1));
    if (on && lock === 1) {
      if (!gutterOK) {
        var g = window.innerWidth - document.documentElement.clientWidth;
        if (g > 0) document.body.style[side] = g + 'px';
      }
      document.body.style.overflow = 'hidden';
    } else if (!on && lock === 0) {
      document.body.style.overflow = '';
      document.body.style[side] = '';
    }
  };
})();

/* ---- benefits carousel: infinite, auto-advancing, edge fades,
        arrows + drag/swipe. Runs before the popup binds its clicks so the
        cloned items open the popup too. ---- */
(function () {
  var car = document.querySelector('.benefit-carousel');
  if (!car) return;
  var vp = car.querySelector('.car-viewport');
  var track = car.querySelector('.benefit-list');
  var prev = car.querySelector('.car-prev');
  var next = car.querySelector('.car-next');
  var orig = Array.prototype.slice.call(track.children);
  var n = orig.length;
  if (n < 2) return;

  // one cloned set on each side -> seamless loop
  function cloneSet() {
    var f = document.createDocumentFragment();
    orig.forEach(function (li) {
      var c = li.cloneNode(true);
      c.setAttribute('aria-hidden', 'true');
      c.querySelectorAll('button').forEach(function (b) {
        b.tabIndex = -1; b.setAttribute('aria-hidden', 'true');
      });
      f.appendChild(c);
    });
    return f;
  }
  track.insertBefore(cloneSet(), track.firstChild);
  track.appendChild(cloneSet());

  var DELAY = 3200;                         // ms each benefit stays put
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var index = n, pitch = 0, timer = null;
  var hold = { hover: false, focus: false, drag: false, modal: false };

  function measure() {
    var b = track.querySelectorAll('.benefit');
    pitch = Math.abs(b[1].getBoundingClientRect().left - b[0].getBoundingClientRect().left);
  }
  // RTL track: moving it right (+x) brings the next items in from the left
  function set(x, animate) {
    track.classList.toggle('is-animating', !!animate);
    track.style.transform = 'translate3d(' + x + 'px,0,0)';
  }
  function current() {
    var t = getComputedStyle(track).transform;
    if (!t || t === 'none') return index * pitch;
    return new DOMMatrixReadOnly(t).m41;
  }
  function normalize() {
    if (index >= 2 * n) index -= n;
    else if (index < n) index += n;
    else return;
    set(index * pitch, false);
    void track.offsetWidth;                 // commit before animating again
  }
  function step(d) {
    normalize();
    index += d;
    set(index * pitch, true);
  }
  track.addEventListener('transitionend', function (e) {
    if (e.target === track) normalize();
  });

  // ---- autoplay ----
  function running() {
    return !reduce && !document.hidden &&
      !hold.hover && !hold.focus && !hold.drag && !hold.modal;
  }
  function schedule() {
    clearTimeout(timer);
    if (running()) timer = setTimeout(function () { step(1); schedule(); }, DELAY);
  }
  car.addEventListener('pointerenter', function (e) {
    if (e.pointerType === 'mouse') { hold.hover = true; schedule(); }
  });
  car.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse') { hold.hover = false; schedule(); }
  });
  car.addEventListener('focusin', function (e) {
    if (!e.target.matches(':focus-visible')) return;
    hold.focus = true; schedule();
    // keyboard focus on a benefit that is in the fade -> bring it to the start
    var li = e.target.closest('li');
    if (li && li.parentNode === track) {
      var k = Array.prototype.indexOf.call(track.children, li);
      var visible = Math.max(1, Math.round(car.clientWidth / pitch));
      if (k < index || k >= index + visible) { index = k; set(index * pitch, true); }
    }
  });
  car.addEventListener('focusout', function () {
    setTimeout(function () {
      hold.focus = car.contains(document.activeElement) &&
        document.activeElement.matches(':focus-visible');
      schedule();
    }, 0);
  });
  document.addEventListener('visibilitychange', schedule);
  var modal = document.getElementById('benefitModal');
  if (modal && window.MutationObserver) {
    new MutationObserver(function () { hold.modal = !modal.hidden; schedule(); })
      .observe(modal, { attributes: true, attributeFilter: ['hidden'] });
  }

  // ---- arrows ----
  if (next) next.addEventListener('click', function () { step(1); schedule(); });
  if (prev) prev.addEventListener('click', function () { step(-1); schedule(); });

  // ---- drag (mouse) / swipe (touch); vertical swipes still scroll the page ----
  var startX = 0, lastX = 0, base = 0, moved = false, pid = null;
  vp.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    normalize();
    base = current();
    index = Math.round(base / pitch);
    set(base, false);
    startX = lastX = e.clientX; moved = false; pid = e.pointerId;
    hold.drag = true; clearTimeout(timer);
  });
  vp.addEventListener('pointermove', function (e) {
    if (!hold.drag || e.pointerId !== pid) return;
    lastX = e.clientX;
    var dx = lastX - startX;
    if (!moved && Math.abs(dx) > 6) {
      moved = true;
      vp.classList.add('is-dragging');
      try { vp.setPointerCapture(pid); } catch (err) {}
    }
    if (moved) set(base + dx, false);
  });
  function end() {
    if (!hold.drag) return;
    hold.drag = false;
    vp.classList.remove('is-dragging');
    if (moved) {
      var dx = lastX - startX;
      var i = Math.round((base + dx) / pitch);
      // a short flick still moves one benefit
      if (i === Math.round(base / pitch) && Math.abs(dx) > pitch * 0.12) i += dx > 0 ? 1 : -1;
      index = i;
      set(index * pitch, true);
    }
    schedule();
  }
  vp.addEventListener('pointerup', end);
  vp.addEventListener('pointercancel', end);
  // a drag must not also count as a click (which opens the popup)
  vp.addEventListener('click', function (e) {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
  }, true);
  vp.addEventListener('dragstart', function (e) { e.preventDefault(); });
  // focus can make the browser scroll an overflow:hidden box — undo it
  vp.addEventListener('scroll', function () { vp.scrollLeft = 0; });

  function layout() { measure(); set(index * pitch, false); }
  window.addEventListener('resize', layout);
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  schedule();
})();

/* ---- benefit popup ---- */
(function () {
  var modal = document.getElementById('benefitModal');
  if (!modal) return;
  var titleEl = modal.querySelector('.modal-title');
  var textEl = modal.querySelector('.modal-text');
  var closeBtn = modal.querySelector('.modal-close');
  var lastFocused = null;

  function openModal(btn) {
    titleEl.textContent = btn.getAttribute('data-title') || '';
    textEl.textContent = btn.getAttribute('data-text') || '';
    lastFocused = btn;
    modal.hidden = false;
    window.__scrollLock(true);
    closeBtn.focus();
  }
  function closeModal() {
    modal.hidden = true;
    window.__scrollLock(false);
    if (lastFocused) { lastFocused.focus(); lastFocused = null; }
  }

  document.querySelectorAll('.benefit').forEach(function (btn) {
    btn.addEventListener('click', function () { openModal(btn); });
  });
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
})();

/* ---- side menu (hamburger drawer) ---- */
(function () {
  var toggle = document.querySelector('.menu-toggle');
  var menu = document.getElementById('sideMenu');
  if (!toggle || !menu) return;

  function openMenu() {
    menu.classList.add('open');
    menu.setAttribute('aria-hidden', 'false');
    toggle.setAttribute('aria-expanded', 'true');
    document.body.classList.add('menu-open');
    window.__scrollLock(true);
  }
  function closeMenu() {
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
    toggle.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('menu-open');
    window.__scrollLock(false);
  }
  function toggleMenu() {
    menu.classList.contains('open') ? closeMenu() : openMenu();
  }

  toggle.addEventListener('click', toggleMenu);
  menu.querySelectorAll('[data-menu-close]').forEach(function (el) {
    el.addEventListener('click', closeMenu);
  });
  menu.querySelectorAll('.side-menu-link').forEach(function (a) {
    a.addEventListener('click', closeMenu);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('open')) {
      closeMenu();
      toggle.focus();
    }
  });
})();
</script>
