<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ועד עובדי פלאפון — ההסכם הקיבוצי 2026</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="site-header">
  <div class="wrap header-inner">
    <div class="header-right">
      <button class="menu-toggle" type="button" aria-label="תפריט"
              aria-expanded="false" aria-controls="sideMenu">
        <svg class="burger" viewBox="0 0 30 22" aria-hidden="true">
          <line class="burger-line burger-top" x1="2" y1="4"  x2="28" y2="4"/>
          <line class="burger-line burger-mid" x1="2" y1="11" x2="28" y2="11"/>
          <line class="burger-line burger-bot" x1="2" y1="18" x2="28" y2="18"/>
        </svg>
      </button>
      <span class="header-divider" aria-hidden="true"></span>
      <a href="#" class="logo" aria-label="ועד עובדי פלאפון">
        <img src="assets/logo.png" alt="ועד עובדי פלאפון">
      </a>
    </div>

    <a href="#" class="home-link" aria-label="דף הבית">
      <img src="assets/home-icon.png" alt="דף הבית">
    </a>
  </div>
</header>

<!-- ============ SIDE MENU ============ -->
<div class="side-menu" id="sideMenu" aria-hidden="true">
  <div class="side-menu-backdrop" data-menu-close></div>
  <nav class="side-menu-panel" aria-label="תפריט ראשי">
    <a class="side-menu-link"
       href="https://www.calcalist.co.il/local_news/article/rk8lyqyqwx"
       target="_blank" rel="noopener">
      <span>לכתבה בכלכליסט</span><span class="gt">&gt;</span>
    </a>
    <a class="side-menu-link" href="#">
      <span>לתנאי ההסכם המלאים</span><span class="gt">&gt;</span>
    </a>
  </nav>
</div>

<!-- ============ HERO ============ -->
<section class="hero">
  <div class="hero-inner">
    <figure class="video-frame">
      <video id="mainVideo" class="video-el"
             src="assets/main-video.mp4"
             poster="assets/video-poster.jpg"
             playsinline preload="metadata"></video>
      <button class="play-btn" id="playBtn" type="button" aria-label="נגן סרטון"></button>
    </figure>
  </div>
</section>

<!-- ============ BLUE STRIP ============ -->
<section class="strip">
  <a href="#" class="strip-link">
    <span>תנאי ההסכם המלאים</span>
    <img class="chev" src="assets/chevron-strip.png" alt="" aria-hidden="true">
  </a>
</section>

<!-- ============ BENEFITS ============ -->
<section class="benefits">
  <div class="wrap">
    <h1 class="benefits-title">הישגי ההסכם הקיבוצי חברת פלאפון</h1>
    <img class="chev-down" src="assets/chevron-down.png" alt="" aria-hidden="true">

    <ul class="benefit-list">
      <li>
        <button type="button" class="benefit"
          data-title="עבודה מהבית"
          data-text="במסגרת ההסכם הקיבוצי התחייבה פלאפון לאפשר לעובדים יומיים של עבודה מהבית בשבוע, כחלק ממודל עבודה מודרני שנועד להבטיח תמהיל מיטבי של עבודה ופנאי.">
          <span class="benefit-ico"><img src="assets/icon-1-work-from-home.png" alt=""></span>
          <span class="benefit-label">עבודה<br>מהבית <span class="gt">&gt;</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="benefit"
          data-title="קיצור יום העבודה"
          data-text="יום העבודה של עובדי המטה מתקצר ל-8 שעות. הקיצור נקבע לצד הרחבת העבודה מהבית, כחלק ממעבר למודל עבודה מתקדם שסוכם בהסכם.">
          <span class="benefit-ico"><img src="assets/icon-2-shorter-week.png" alt=""></span>
          <span class="benefit-label">קיצור יום<br>העבודה <span class="gt">&gt;</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="benefit"
          data-title="תוספת שכר"
          data-text="תוספת שכר קבועה של 9%, שתוכל לעלות עד ל-10.5% בעמידה ביעדי &quot;מצוינות&quot;. לצדה נקבעו מנגנון תוספות תקדימי לבעלי השכר הנמוך שמקרב אותם לשכר הממוצע במשק, ומענק חד-פעמי של עד 30 אלף ש&quot;ח לכל עובד.">
          <span class="benefit-ico"><img src="assets/icon-3-raise.png" alt=""></span>
          <span class="benefit-label">תוספת<br>שכר <span class="gt">&gt;</span></span>
        </button>
      </li>
      <li>
        <button type="button" class="benefit"
          data-title="הגדלת דמי הבראה"
          data-text="דמי ההבראה עולים ל-600 ש&quot;ח ליום. בנוסף חולקו שוברים בסך 1,500 ש&quot;ח לרכישת אביזרי סלולר, ונקבעו הפרשות לקרן השתלמות גם על רכיבי תמריצים ולא רק על השכר הקבוע.">
          <span class="benefit-ico"><img src="assets/icon-4-company-vacation.png" alt=""></span>
          <span class="benefit-label">הגדלת דמי<br>הבראה <span class="gt">&gt;</span></span>
        </button>
      </li>
    </ul>
  </div>
</section>

<!-- ============ NEWS ============ -->
<section class="news">
  <div class="wrap">
    <ul class="news-list">
      <li class="news-card">
        <img class="news-logo" src="assets/news-logo-1.png" alt="כלכליסט">
        <img class="news-shot" src="assets/news-1.png" alt="נחתם הסכם קיבוצי חדש בפלאפון: פנסיה מוקדמת מגיל 58 ותוספת שכר של לפחות 9%">
        <a href="https://www.calcalist.co.il/local_news/article/rk8lyqyqwx" class="news-link" target="_blank" rel="noopener">לכתבה המלאה <span class="gt">&gt;</span></a>
      </li>
      <li class="news-card">
        <img class="news-logo" src="assets/news-logo-3.png" alt="TheMarker">
        <img class="news-shot" src="assets/news-3.png" alt="כתבה לדוגמה">
        <a href="#" class="news-link">לכתבה המלאה <span class="gt">&gt;</span></a>
      </li>
    </ul>
  </div>
</section>

<!-- ============ BENEFIT POPUP ============ -->
<div class="modal" id="benefitModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="benefitModalTitle">
    <button class="modal-close" type="button" aria-label="סגירה" data-close>&times;</button>
    <h3 class="modal-title" id="benefitModalTitle"></h3>
    <p class="modal-text"></p>
  </div>
</div>

<!-- ============ FOOTER ============ -->
<footer class="site-footer">
  <ul class="social">
    <li><a href="#" aria-label="X"><img src="assets/social-x.png" alt="X"></a></li>
    <li><a href="#" aria-label="Facebook"><img src="assets/social-facebook.png" alt="Facebook"></a></li>
    <li><a href="#" aria-label="Instagram"><img src="assets/social-instagram.png" alt="Instagram"></a></li>
    <li><a href="#" aria-label="YouTube"><img src="assets/social-youtube.png" alt="YouTube"></a></li>
  </ul>
</footer>

<script>
/* ---- hero video ---- */
(function () {
  var v = document.getElementById('mainVideo');
  var b = document.getElementById('playBtn');
  if (!v || !b) return;
  b.addEventListener('click', function () { v.play(); });
  v.addEventListener('play', function () {
    b.hidden = true;
    v.setAttribute('controls', '');
  });
})();

/* ---- benefit popup ---- */
(function () {
  var modal = document.getElementById('benefitModal');
  if (!modal) return;
  var titleEl = modal.querySelector('.modal-title');
  var textEl = modal.querySelector('.modal-text');
  var closeBtn = modal.querySelector('.modal-close');
  var lastFocused = null;

  function openModal(btn) {
    titleEl.textContent = btn.getAttribute('data-title') || '';
    textEl.textContent = btn.getAttribute('data-text') || '';
    lastFocused = btn;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    closeBtn.focus();
  }
  function closeModal() {
    modal.hidden = true;
    document.body.style.overflow = '';
    if (lastFocused) { lastFocused.focus(); lastFocused = null; }
  }

  document.querySelectorAll('.benefit').forEach(function (btn) {
    btn.addEventListener('click', function () { openModal(btn); });
  });
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
})();

/* ---- side menu (hamburger drawer) ---- */
(function () {
  var toggle = document.querySelector('.menu-toggle');
  var menu = document.getElementById('sideMenu');
  if (!toggle || !menu) return;

  function openMenu() {
    menu.classList.add('open');
    menu.setAttribute('aria-hidden', 'false');
    toggle.setAttribute('aria-expanded', 'true');
    document.body.classList.add('menu-open');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu() {
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
    toggle.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('menu-open');
    document.body.style.overflow = '';
  }
  function toggleMenu() {
    menu.classList.contains('open') ? closeMenu() : openMenu();
  }

  toggle.addEventListener('click', toggleMenu);
  menu.querySelectorAll('[data-menu-close]').forEach(function (el) {
    el.addEventListener('click', closeMenu);
  });
  menu.querySelectorAll('.side-menu-link').forEach(function (a) {
    a.addEventListener('click', closeMenu);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('open')) {
      closeMenu();
      toggle.focus();
    }
  });
})();
</script>

</body>
</html>
