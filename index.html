<script>
/* ---- hero video: autoplays muted, button toggles sound ---- */
(function () {
  var v = document.getElementById('mainVideo');
  var b = document.getElementById('soundBtn');
  var fb = document.getElementById('playFallback');
  if (!v) return;

  function tryPlay() {
    v.muted = true;                     // muted autoplay is what browsers allow
    var p = v.play();
    if (p && p.then) {
      p.then(function () { if (fb) fb.hidden = true; })
       .catch(function () { if (fb) fb.hidden = false; });
    }
  }
  tryPlay();
  v.addEventListener('canplay', function () { if (v.paused) tryPlay(); });
  v.addEventListener('play',  function () { if (fb) fb.hidden = true; });
  v.addEventListener('pause', function () { if (fb && !v.ended) fb.hidden = false; });

  // some browsers only allow playback after the first interaction
  ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (ev) {
    window.addEventListener(ev, function once() {
      if (v.paused) tryPlay();
      ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (e2) {
        window.removeEventListener(e2, once);
      });
    }, { passive: true });
  });
  if (fb) fb.addEventListener('click', tryPlay);

  if (!b) return;
  b.addEventListener('click', function () {
    v.muted = !v.muted;
    if (!v.muted) v.play();
    b.setAttribute('aria-pressed', String(!v.muted));
    b.setAttribute('aria-label', v.muted ? 'הפעלת קול' : 'השתקה');
    b.classList.toggle('is-on', !v.muted);
  });
})();

/* ---- keep the page from shifting when the scrollbar is hidden ----
   `scrollbar-gutter: stable` (style.css) already reserves the scrollbar's
   space, so padding is only added where that isn't supported. Doing both
   compensates twice and shifts the page by the scrollbar width. */
(function () {
  var lock = 0;
  var gutterOK = window.CSS && CSS.supports && CSS.supports('scrollbar-gutter', 'stable');
  var side = getComputedStyle(document.documentElement).direction === 'rtl'
    ? 'paddingLeft' : 'paddingRight';   // the root scrollbar sits on the left in RTL
  window.__scrollLock = function (on) {
    lock = Math.max(0, lock + (on ? 1 : -1));
    if (on && lock === 1) {
      if (!gutterOK) {
        var g = window.innerWidth - document.documentElement.clientWidth;
        if (g > 0) document.body.style[side] = g + 'px';
      }
      document.body.style.overflow = 'hidden';
    } else if (!on && lock === 0) {
      document.body.style.overflow = '';
      document.body.style[side] = '';
    }
  };
})();

/* ---- benefits carousel: arrows + mouse drag (touch scrolls natively) ---- */
(function () {
  var wrap = document.querySelector('.benefit-carousel');
  if (!wrap) return;
  var list = wrap.querySelector('.benefit-list');
  var prev = wrap.querySelector('.car-prev');
  var next = wrap.querySelector('.car-next');
  var items = list.querySelectorAll('.benefit');

  // RTL scrollLeft runs 0 → negative in current browsers; normalise to a
  // positive "distance from the start"
  var sign = -1;
  list.scrollLeft = -1;
  if (list.scrollLeft === 0) sign = 1;
  list.scrollLeft = 0;

  function max() { return list.scrollWidth - list.clientWidth; }
  function pos() { return Math.abs(list.scrollLeft); }
  function pitch() {
    if (items.length < 2) return list.clientWidth;
    return Math.abs(items[1].getBoundingClientRect().left - items[0].getBoundingClientRect().left);
  }
  function go(d, smooth) {
    d = Math.max(0, Math.min(max(), d));
    list.scrollTo({ left: sign * d, behavior: smooth === false ? 'auto' : 'smooth' });
  }
  function snap(dir) {             // dir: +1 next, -1 prev, 0 nearest
    var p = pitch();
    var i = Math.round(pos() / p) + dir;
    go(i * p);
  }
  function update() {
    var p = pos(), m = max();
    if (prev) prev.disabled = p <= 2;
    if (next) next.disabled = p >= m - 2;
  }
  if (next) next.addEventListener('click', function () { snap(1); });
  if (prev) prev.addEventListener('click', function () { snap(-1); });
  list.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();

  // drag with the mouse (touch and pen already scroll natively)
  var down = false, dragging = false, startX = 0, startPos = 0, pid = null;
  list.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    down = true; dragging = false; pid = e.pointerId;
    startX = e.clientX; startPos = pos();
  });
  list.addEventListener('pointermove', function (e) {
    if (!down) return;
    var dx = e.clientX - startX;
    if (!dragging && Math.abs(dx) > 6) {
      dragging = true;
      list.classList.add('is-dragging');
      try { list.setPointerCapture(pid); } catch (err) {}
    }
    // RTL: dragging to the right reveals the items further to the left
    if (dragging) go(startPos + dx, false);
  });
  function end() {
    if (!down) return;
    down = false;
    list.classList.remove('is-dragging');
    if (dragging) snap(0);
  }
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  // a drag must not also count as a click on a benefit (which opens its popup)
  list.addEventListener('click', function (e) {
    if (dragging) { e.preventDefault(); e.stopPropagation(); dragging = false; }
  }, true);
  list.addEventListener('dragstart', function (e) { e.preventDefault(); });
})();

/* ---- benefit popup ---- */
(function () {
  var modal = document.getElementById('benefitModal');
  if (!modal) return;
  var titleEl = modal.querySelector('.modal-title');
  var textEl = modal.querySelector('.modal-text');
  var closeBtn = modal.querySelector('.modal-close');
  var lastFocused = null;

  function openModal(btn) {
    titleEl.textContent = btn.getAttribute('data-title') || '';
    textEl.textContent = btn.getAttribute('data-text') || '';
    lastFocused = btn;
    modal.hidden = false;
    window.__scrollLock(true);
    closeBtn.focus();
  }
  function closeModal() {
    modal.hidden = true;
    window.__scrollLock(false);
    if (lastFocused) { lastFocused.focus(); lastFocused = null; }
  }

  document.querySelectorAll('.benefit').forEach(function (btn) {
    btn.addEventListener('click', function () { openModal(btn); });
  });
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
})();

/* ---- side menu (hamburger drawer) ---- */
(function () {
  var toggle = document.querySelector('.menu-toggle');
  var menu = document.getElementById('sideMenu');
  if (!toggle || !menu) return;

  function openMenu() {
    menu.classList.add('open');
    menu.setAttribute('aria-hidden', 'false');
    toggle.setAttribute('aria-expanded', 'true');
    document.body.classList.add('menu-open');
    window.__scrollLock(true);
  }
  function closeMenu() {
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
    toggle.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('menu-open');
    window.__scrollLock(false);
  }
  function toggleMenu() {
    menu.classList.contains('open') ? closeMenu() : openMenu();
  }

  toggle.addEventListener('click', toggleMenu);
  menu.querySelectorAll('[data-menu-close]').forEach(function (el) {
    el.addEventListener('click', closeMenu);
  });
  menu.querySelectorAll('.side-menu-link').forEach(function (a) {
    a.addEventListener('click', closeMenu);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('open')) {
      closeMenu();
      toggle.focus();
    }
  });
})();
</script>
