        </button>
      </li>
      <li>
        <button type="button" class="benefit"

      </li>

<!-- ============ BENEFIT POPUP ============ -->
<div class="modal" id="benefitModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="benefitModalTitle">
    <button class="modal-close" type="button" aria-label="סגירה" data-close>&times;</button>
    <h3 class="modal-title" id="benefitModalTitle"></h3>

  </div>
</div>

    <li><a href="#" aria-label="YouTube"><img src="assets/social-youtube.png" alt="YouTube"></a></li>
  </ul>
</footer>

<script>
/* ---- hero video: autoplays muted, button toggles sound ---- */
(function () {
  var v = document.getElementById('mainVideo');
  var b = document.getElementById('soundBtn');
  var fb = document.getElementById('playFallback');
  if (!v) return;

  function tryPlay() {
    v.muted = true;                     // muted autoplay is what browsers allow
    var p = v.play();
    if (p && p.then) {
      p.then(function () { if (fb) fb.hidden = true; })
       .catch(function () { if (fb) fb.hidden = false; });
    }
  }
  tryPlay();
  v.addEventListener('canplay', function () { if (v.paused) tryPlay(); });
  v.addEventListener('play',  function () { if (fb) fb.hidden = true; });
  v.addEventListener('pause', function () { if (fb && !v.ended) fb.hidden = false; });

  // some browsers only allow playback after the first interaction
  ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (ev) {
    window.addEventListener(ev, function once() {
      if (v.paused) tryPlay();
      ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(function (e2) {
        window.removeEventListener(e2, once);
      });
    }, { passive: true });
  });
  if (fb) fb.addEventListener('click', tryPlay);

  if (!b) return;
  b.addEventListener('click', function () {
    v.muted = !v.muted;
    if (!v.muted) v.play();
    b.setAttribute('aria-pressed', String(!v.muted));
    b.setAttribute('aria-label', v.muted ? 'הפעלת קול' : 'השתקה');
    b.classList.toggle('is-on', !v.muted);
  });
})();

/* ---- keep the page from shifting when the scrollbar is hidden ---- */
(function () {
  var lock = 0;
  function gap() {
    return window.innerWidth - document.documentElement.clientWidth;
  }
  window.__scrollLock = function (on) {
    lock = Math.max(0, lock + (on ? 1 : -1));
    if (lock === 1 && on) {
      var g = gap();
      if (g > 0) document.body.style.paddingRight = g + 'px';
      document.body.style.overflow = 'hidden';
    } else if (lock === 0) {
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }
  };
})();

/* ---- benefit popup ---- */
(function () {
  var modal = document.getElementById('benefitModal');
  if (!modal) return;
  var titleEl = modal.querySelector('.modal-title');
  var textEl = modal.querySelector('.modal-text');
  var closeBtn = modal.querySelector('.modal-close');
  var lastFocused = null;

  function openModal(btn) {
    titleEl.textContent = btn.getAttribute('data-title') || '';
    textEl.textContent = btn.getAttribute('data-text') || '';
    lastFocused = btn;
    modal.hidden = false;
    window.__scrollLock(true);
    closeBtn.focus();
  }
  function closeModal() {
    modal.hidden = true;
    window.__scrollLock(false);
    if (lastFocused) { lastFocused.focus(); lastFocused = null; }
  }

  document.querySelectorAll('.benefit').forEach(function (btn) {
    btn.addEventListener('click', function () { openModal(btn); });
  });
  modal.addEventListener('click', function (e) {
    if (e.target.hasAttribute('data-close')) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
})();

/* ---- side menu (hamburger drawer) ---- */
(function () {
  var toggle = document.querySelector('.menu-toggle');
  var menu = document.getElementById('sideMenu');
  if (!toggle || !menu) return;

  function openMenu() {
    menu.classList.add('open');
    menu.setAttribute('aria-hidden', 'false');
    toggle.setAttribute('aria-expanded', 'true');
    document.body.classList.add('menu-open');
    window.__scrollLock(true);
  }
  function closeMenu() {
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
    toggle.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('menu-open');
    window.__scrollLock(false);
  }
  function toggleMenu() {
    menu.classList.contains('open') ? closeMenu() : openMenu();
  }

  toggle.addEventListener('click', toggleMenu);
  menu.querySelectorAll('[data-menu-close]').forEach(function (el) {
    el.addEventListener('click', closeMenu);
  });
  menu.querySelectorAll('.side-menu-link').forEach(function (a) {
    a.addEventListener('click', closeMenu);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('open')) {
      closeMenu();
      toggle.focus();
    }
  });
})();
</script>

</body>
